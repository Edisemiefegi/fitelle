name: Push alerts

# Vercel's free plan only allows one cron run a day, so GitHub (free) pings the endpoint hourly.
# Setup: repo Settings > Secrets and variables > Actions, add
#   APP_URL      e.g. https://fitelle.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var in Vercel
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the alerts endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/send-alerts"
